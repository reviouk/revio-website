<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="cd-mark"><style>
/* ---------- Clear Desk mark: inbox to zero (Rob, 20 Nov 2026) ----------
   Three sheets lift out of the tray, the red badge counts 3, 2, 1 and turns
   into a mint tick. Five-second loop; still for reduced motion. */
* { transform-box: fill-box; transform-origin: center; }
.cdm-s1 { animation: cdmOut1 5s ease infinite; }
.cdm-s2 { animation: cdmOut2 5s ease infinite; }
.cdm-s3 { animation: cdmOut3 5s ease infinite; }
.cdm-n3 { animation: cdmN3 5s steps(1) infinite; }
.cdm-n2 { animation: cdmN2 5s steps(1) infinite; opacity: 0; }
.cdm-n1 { animation: cdmN1 5s steps(1) infinite; opacity: 0; }
.cdm-red { animation: cdmRed 5s ease infinite; }
.cdm-ok { animation: cdmOk 5s cubic-bezier(.3,1.6,.5,1) infinite; opacity: 0; }
@keyframes cdmOut1 { 0%,14% { opacity: 1; transform: none; } 22% { opacity: 0; transform: translateY(-12px) rotate(10deg); } 92% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
@keyframes cdmOut2 { 0%,32% { opacity: 1; transform: none; } 40% { opacity: 0; transform: translateY(-12px) rotate(-10deg); } 94% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
@keyframes cdmOut3 { 0%,50% { opacity: 1; transform: none; } 58% { opacity: 0; transform: translateY(-12px) rotate(8deg); } 96% { opacity: 0; transform: translateY(4px); } 100% { opacity: 1; transform: none; } }
@keyframes cdmN3 { 0% { opacity: 1; } 20% { opacity: 0; } 98% { opacity: 1; } }
@keyframes cdmN2 { 0% { opacity: 0; } 20% { opacity: 1; } 38% { opacity: 0; } }
@keyframes cdmN1 { 0% { opacity: 0; } 38% { opacity: 1; } 56% { opacity: 0; } }
@keyframes cdmRed { 0%,55% { opacity: 1; transform: scale(1); } 60%,94% { opacity: 0; transform: scale(.4); } 100% { opacity: 1; transform: scale(1); } }
@keyframes cdmOk { 0%,58% { opacity: 0; transform: scale(.3); } 66% { opacity: 1; transform: scale(1); } 90% { opacity: 1; transform: scale(1); } 96%,100% { opacity: 0; transform: scale(.3); } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .cdm-s1, .cdm-s2, .cdm-s3, .cdm-red { opacity: 0; }
  .cdm-ok { opacity: 1; }
}
</style><defs><clipPath id="cdmclip"><rect x="3" y="3" width="42" height="42" rx="13"/></clipPath></defs><rect x="3" y="3" width="42" height="42" rx="13" fill="#5862ff"/><g clip-path="url(#cdmclip)"><g class="cdm-s3"><rect x="16" y="13" width="15" height="12" rx="1.5" fill="#fff" opacity=".5"/></g><g class="cdm-s2"><rect x="17" y="16" width="15" height="12" rx="1.5" fill="#fff" opacity=".75"/></g><g class="cdm-s1"><rect x="15.5" y="19" width="15" height="10" rx="1.5" fill="#fff"/></g><path d="M9 26 L13 26 a3 3 0 0 1 2.7 1.7 l.8 1.6 a3 3 0 0 0 2.7 1.7 h9.6 a3 3 0 0 0 2.7 -1.7 l.8 -1.6 A3 3 0 0 1 35 26 L39 26 V34 a4 4 0 0 1 -4 4 H13 a4 4 0 0 1 -4 -4 Z" fill="#fff"/></g><g class="cdm-red"><circle cx="37" cy="12" r="6.5" fill="#ff5a6e" stroke="#5862ff" stroke-width="2"/><text class="cdm-n3" x="37" y="15.2" text-anchor="middle" font-family="Satoshi, Inter, sans-serif" font-weight="800" font-size="9" fill="#fff">3</text><text class="cdm-n2" x="37" y="15.2" text-anchor="middle" font-family="Satoshi, Inter, sans-serif" font-weight="800" font-size="9" fill="#fff">2</text><text class="cdm-n1" x="37" y="15.2" text-anchor="middle" font-family="Satoshi, Inter, sans-serif" font-weight="800" font-size="9" fill="#fff">1</text></g><g class="cdm-ok"><circle cx="37" cy="12" r="6.5" fill="#12c98b" stroke="#5862ff" stroke-width="2"/><path d="M34 12.2 l2 2 4-4.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
