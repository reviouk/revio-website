<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="cd-mark"><style>.cd-mark * { transform-box: fill-box; transform-origin: center; } .cd-mark .cdm-track { animation: cdmTrack 6s ease infinite; } .cd-mark .cdm-knob { animation: cdmKnob 6s cubic-bezier(.5,0,.2,1.25) infinite; } .cd-mark .cdm-tick { animation: cdmTick 6s ease infinite; } @keyframes cdmTrack { 0%,3% { fill: #12c98b; fill-opacity: 1; } 9%,24% { fill: #fff; fill-opacity: .3; } 33%,100% { fill: #12c98b; fill-opacity: 1; } } @keyframes cdmKnob { 0%,3% { transform: none; } 9%,24% { transform: translateX(-14px); } 33%,100% { transform: none; } } @keyframes cdmTick { 0%,2% { opacity: 1; transform: scale(1); } 6%,31% { opacity: 0; transform: scale(.4); } 39%,100% { opacity: 1; transform: scale(1); } } @media (prefers-reduced-motion: reduce) { .cd-mark * { animation: none !important; } }</style><rect x="3" y="3" width="42" height="42" rx="13" fill="#5862ff"/><rect class="cdm-track" x="8" y="15" width="32" height="18" rx="9" fill="#12c98b"/><g class="cdm-knob"><circle cx="31" cy="24" r="6.5" fill="#fff"/><path class="cdm-tick" d="M28 24.2l2.2 2.2 3.9-4.3" fill="none" stroke="#12c98b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
