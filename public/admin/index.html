<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revio admin</title>
<meta name="robots" content="noindex, nofollow">
<!-- The address the team types. The delivery dashboard is a separate Render
     service, so this cannot be served under revio.agency itself -- it is a
     forward, and the address bar ends up on the dashboard's own hostname.
     Deliberately NOT in the site menu: staff door, not a public one. -->
<meta http-equiv="refresh" content="0; url=https://admin.revio.agency/">
<script>location.replace("https://admin.revio.agency/");</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:#f7f7fb;color:#1a1148;display:grid;place-items:center;min-height:100vh;
    margin:0;padding:24px;text-align:center;line-height:1.6}
  a{color:#382294;font-weight:600}
</style>
</head>
<body>
  <!-- Only seen if the redirect is blocked. -->
  <p>Taking you to the delivery dashboard&hellip;<br>
    <a href="https://admin.revio.agency/">Continue</a></p>
</body>
</html>
